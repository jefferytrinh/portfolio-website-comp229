<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>John Doe Realty</h1>
    <nav>
      <a href="index.html">Home</a>

      <a href="contact.html">Contact</a>
      <a href="sitemap.html">Site Map</a>
      <a href="../index/index.html">To Main (COMP 213)</a>
    </nav>
  </header>
  <main>
  <h2>Contact Form</h2>
  <form action="mailto:johndoerealty@hotmail.com" method="post">
    <label>First Name: <input type="text" name="first"></label><br>
    <label>Last Name: <input type="text" name="last"></label><br>
    <label>Phone: <input type="tel" name="phone"></label><br>
    <label>Email: <input type="email" name="email"></label><br>
    <label>Property Type:
      <select name="type">
        <option>House</option>
        <option>Condominium</option>
      </select>
    </label><br>
    <label>Bedrooms: <input type="number" name="bedrooms"></label><br>
    <label>Bathrooms: <input type="number" name="bathrooms"></label><br>
    <label>Price Range: <input type="text" name="price"></label><br>
    <label>Comments:<br>
      <textarea name="comments"></textarea>
    </label><br>
    <button type="submit">Send</button>
    <button type="reset">Reset</button>
  </form>
  </main>
  <footer>
    <p>&copy; 2025 John Doe Realty | Jeffery Trinh</p>
  </footer>
</body>
</html>
